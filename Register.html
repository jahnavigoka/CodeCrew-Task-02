<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Navigation bar */
        nav{
            background-color: #0f172a;
            padding: 15px;
            text-align: center;
        }

        nav a{
            color: #ffffff;
            text-decoration: none;
            margin: 0 12px;
            font-weight: 500;
        }

        nav a:hover{
            color: #38bdf8;
            text-decoration: underline;
        }

        /* Page heading */
        h1{
            text-align: center;
            margin-top: 40px;
            color: #0f172a;
        }

        /* Form styling */
        form{
            background-color: #ffffff;
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        label{
            font-weight: 600;
        }

        input, select{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button{
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover{
            background-color: #1e293b;
        }

        /* Footer */
        footer{
            margin-top: 60px;
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 15px 0;
            font-size: 14px;
        }
    </style>
</head>

<body>

   <nav>
        <a href="task2crew.html">Home</a> |
        <a href="EventSchedule.html">Schedule</a> |
        <a href="Speakers.html">Speakers</a> |
        <a href="Register.html">Register</a> |
        <a href="aboutevent.html">About</a>
    </nav>

    <h1>Register for the Event</h1>

    <form>
        <label>Name:</label>
        <input type="text">

        <label>Email:</label>
        <input type="email">

        <label>Domain of Interest:</label>
        <select>
            <option>Web Development</option>
            <option>AI / ML</option>
            <option>Cyber Security</option>
            <option>Cloud Computing</option>
        </select>

        <button type="submit">Submit</button>
    </form>

    <footer>
        <p>© 2026 Tech Event. All rights reserved.</p>
    </footer>

</body>
</html>
